[pytest]
# The two trees have separate dependency sets and are collected by separate CI
# jobs. Root pytest scopes to the legacy tree so a bare `pytest` from the repo
# root does not fail collecting wallee_v6 (which requires its own install and
# its own pythonpath). Run the v6 suite with: `pytest wallee_v6/tests`.
testpaths = tests wallee
norecursedirs = wallee_v6 .git .venv *.egg-info
addopts = -q
