pack_id: prusa_core_one_plus
display_name: Prusa Core One+
category: additive
python_entrypoint: wallee_v6.packs.prusa_core_one_plus.pack:Pack
capabilities:
  - start_process_from_usb
  - pause_process
  - resume_process
  - stop_process
  - publish_http_state
  - publish_usb_inventory
  - publish_chamber_and_ambient_diagnostics
  - ingest_udp_metrics
detection:
  env_var:
    - PRUSA_CORE_ONE_HOST
    - PRUSALINK_HOST
resources:
  - id: printer_1.bed
    kind: bed
  - id: printer_1.usb_storage
    kind: storage
notes: |
  HTTP via PrusaLink is the authoritative control path.
  UDP metrics are optional high-rate telemetry.
  USB serial is diagnostics-only and intentionally not used for control because
  the current reference deployment has observed instability on the CDC ACM link.
