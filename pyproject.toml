[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wallee"
version = "6.6.0"
description = "Lean context-compiled physical AI kernel for microfactory orchestration."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  {name = "Anieyrudh R."}
]
dependencies = [
  "pydantic>=2.6,<3",
  "PyYAML>=6,<7",
  "jsonschema>=4.0,<5",
  "fastapi>=0.110,<1",
  "uvicorn>=0.29,<1",
  "Pillow>=10,<12",
  "pyserial>=3.5,<4",
  "heatshrinkpy>=0.11.1,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[project.scripts]
wallee = "wallee.main:main"
wallee-watchdog = "wallee.safety_watchdog:main"
wallee-operator = "wallee.operator_cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.package-data]
wallee = [
  "packs/*/manifest.yaml",
]

[tool.setuptools.packages.find]
include = ["wallee*"]
