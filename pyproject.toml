[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wallee"
version = "6.6.0"
description = "Lean context-compiled physical AI kernel for microfactory orchestration."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  {name = "Anieyrudh R."}
]
dependencies = [
  "pydantic>=2.6,<3",
  "PyYAML>=6,<7",
  "jsonschema>=4.0,<5",
  "Pillow>=10,<12",
  "pyserial>=3.5,<4",
  "heatshrinkpy>=0.11.1,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<8",
  "ruff==0.15.8",
  "mypy>=1.11,<2",
  "pre-commit>=3.7,<5",
]

[project.scripts]
wallee = "wallee.main:main"
wallee-watchdog = "wallee.safety_watchdog:main"
wallee-operator = "wallee.operator_cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.package-data]
wallee = [
  "packs/*/manifest.yaml",
]

[tool.setuptools.packages.find]
include = ["wallee*"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true

# Strict scope grows module-by-module toward the whole core (plan Phase 4/5).
# These are the safety-relevant modules that pass --strict today; a regression
# in any of them is a red `mypy` check.
[[tool.mypy.overrides]]
module = [
  "wallee.coerce",
  "wallee.ids",
  "wallee.predicates",
  "wallee.runtime_control",
  "wallee.safety",
  "wallee.stop_transport",
  "wallee.whiteboard",
]
strict = true
