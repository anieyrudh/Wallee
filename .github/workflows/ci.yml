name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  legacy-tests:
    name: legacy-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run legacy tree tests (framework + device packs)
        # Scoped to the legacy tree; wallee_v6 has its own job with its own deps.
        run: pytest tests wallee -q
      - name: Lint legacy tree
        run: ruff check wallee scripts

  v6-tests:
    name: v6-tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install wallee_v6 (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e "wallee_v6[dev]" ruff
      - name: Run v6 tests
        run: pytest wallee_v6/tests -q
      - name: Lint v6 tree
        run: ruff check wallee_v6

  docs-and-contracts:
    name: docs-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Check docs
        run: python scripts/check_docs.py
      - name: Check repo contracts
        run: python scripts/check_repo_contract.py
      - name: Check forbidden patterns
        run: python scripts/check_forbidden_patterns.py
