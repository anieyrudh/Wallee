name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install wallee (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests with the coverage floor
        # The floor only ratchets up: raise it when coverage rises, never
        # lower it to make a PR pass.
        run: pytest tests -q --cov=wallee --cov-report=term --cov-fail-under=72

  gates:
    name: gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install wallee (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run the pre-commit gate set
        # Identical to the local `scripts/gate.sh` fast path: lint, hygiene,
        # forbidden patterns, docs, repo contract, core purity, file sizes.
        run: pre-commit run --all-files --show-diff-on-failure

  mypy:
    name: mypy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install wallee (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Type-check the strict module scope
        # Strict scope is configured in pyproject [tool.mypy]; it grows
        # module-by-module toward the whole core.
        run: mypy wallee/coerce.py wallee/ids.py wallee/predicates.py wallee/runtime_control.py wallee/safety.py wallee/stop_transport.py wallee/whiteboard.py

  safety-invariants:
    name: safety-invariants
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install wallee (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run the six-promise contract suite
        # --strict-markers + the manifest check make this job impossible to
        # green vacuously: zero collection, silent skips, weakened xfails,
        # and deleted invariants all fail here.
        run: pytest tests/contract -q --strict-markers
      - name: Check contract manifest and xfail hygiene
        run: python scripts/check_contract_manifest.py

  adversarial-gates:
    name: adversarial-gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install wallee (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Hostile plans and the translated hazard corpus die at the gates
        # Model-independent: hostile PlanIRs, injection strings, and the
        # 60-scenario replay corpus translated to world-packet key-space.
        run: pytest tests/contract/test_gate_adversarial.py tests/replay -q

  sim-evals:
    name: sim-evals
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install wallee (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Fault-injection trajectory evals over the sim printer
        # Offline and deterministic; pass^k sampling belongs to the live lane.
        run: pytest tests/sim_evals -q

  cassette-replay:
    name: cassette-replay
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install wallee (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Replay recorded planner traffic through the production planner
        # Offline and deterministic. A red here means the outbound prompt or
        # payload changed: regenerate with scripts/record_cassettes.py in a
        # separate [re-record] commit.
        run: pytest tests/test_cassette_replay.py -q

  schema-sync:
    name: schema-sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install wallee (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Schemas match their code sources; manifests validate
        run: python scripts/gen_schemas.py

  docs-contract:
    name: docs-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install wallee (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Check docs
        run: python scripts/check_docs.py

  repo-contract:
    name: repo-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install wallee (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Check pack conformance
        run: python scripts/check_repo_contract.py
      - name: Check forbidden patterns
        run: python scripts/check_forbidden_patterns.py
      - name: Check core purity (device knowledge stays in packs)
        run: python scripts/check_core_purity.py
      - name: Check file sizes (800-line cap, shrink-only ratchet)
        run: python scripts/check_file_sizes.py

  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install wallee and pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install -e . pip-audit
      - name: Audit installed dependencies
        run: pip-audit
